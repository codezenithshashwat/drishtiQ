<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction C — Reading Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="data/case.js"></script><script src="common.js"></script>
<style>body{font-family:"IBM Plex Sans",system-ui,sans-serif;font-feature-settings:"tnum" 1}</style>
</head>
<body class="bg-[#0E1116] text-slate-200 h-screen overflow-hidden">
<div class="h-full grid grid-rows-[48px_1fr]">
  <header class="flex items-center justify-between px-4 border-b border-white/10 bg-[#141922]">
    <div class="flex items-center gap-4 text-sm"><span class="font-semibold text-white">RetinaScreen</span>
      <span class="text-slate-400" id="crumbs"></span></div>
    <div class="flex items-center gap-3 text-sm">
      <div class="inline-flex rounded border border-white/15 overflow-hidden"><span class="px-3 py-1 bg-cyan-500/20 text-cyan-200 font-medium">Simple</span><span class="px-3 py-1 text-slate-400">Clinical</span></div>
      <span class="text-xs text-amber-300/90 border border-amber-300/30 rounded px-2 py-1">Research prototype · not for clinical use</span>
    </div>
  </header>
  <main class="grid grid-cols-[232px_minmax(0,1fr)_400px] min-h-0" id="app"></main>
</div>
<script>
const g = C.grading.grade
document.getElementById('crumbs').textContent = 'Worklist  ›  Case ' + C.source.image_id
document.getElementById('app').innerHTML = `
<nav class="border-r border-white/10 bg-[#121720] p-4 space-y-6 overflow-auto">
  <div>
    <div class="text-[11px] uppercase tracking-wider text-slate-500 mb-2">Layers</div>
    ${LESIONS.map((k) => `<label class="flex items-center gap-2.5 py-1.5 text-sm"><span class="w-4 h-4 rounded-sm grid place-items-center border border-white/20" style="background:${LESION_COLOR[k]}"></span><span class="flex-1">${G[k].plain}</span><span class="text-slate-500 tabular-nums">${F.lesions[k].count}</span></label>`).join('')}
    <label class="flex items-center gap-2.5 py-1.5 text-sm text-slate-400">${ICON('eye')}<span class="flex-1">${G.gradcam.plain}</span><span class="text-xs">off</span></label>
  </div>
  <div>
    <div class="text-[11px] uppercase tracking-wider text-slate-500 mb-2">Landmarks</div>
    <div class="flex items-center gap-2.5 py-1 text-sm"><span class="w-5 border-t-2 border-dashed border-cyan-400"></span>${G.macula.plain}</div>
    <div class="flex items-center gap-2.5 py-1 text-sm"><span class="w-4 h-4 rounded-full border-2 border-white/80"></span>${G.optic_disc.plain}</div>
    <div class="flex items-center gap-2.5 py-1 text-sm"><span class="w-5 border-t border-dashed border-white/60"></span>4 areas</div>
  </div>
  <div class="text-[11px] text-slate-500 leading-relaxed">Image: IDRiD dev-train. Opacity 90%.</div>
</nav>
<section class="bg-black grid place-items-center p-4 min-h-0"><div class="w-full max-w-[1000px]">${imageStack('')}</div></section>
<aside class="border-l border-white/10 bg-[#121720] overflow-auto">
  <div class="p-5 border-b border-white/10">
    <div class="text-[11px] uppercase tracking-wider text-slate-500">Stage of eye damage</div>
    <div class="mt-2 flex items-center gap-3">
      <span class="text-4xl font-semibold tabular-nums" style="color:${STAGE_COLOR[g]}">${g}</span>
      <div><div class="text-white font-medium">${stagePlain(g)}</div><div class="text-xs text-slate-500">${stageClinical(g)} · of 4</div></div>
    </div>
    <div class="mt-3 flex gap-1">${[0,1,2,3,4].map((i) => `<span class="flex-1 h-1.5 rounded" style="background:${i <= g ? STAGE_COLOR[i] : '#2A3240'}"></span>`).join('')}</div>
    <div class="mt-4 flex items-start gap-2 text-sm rounded border border-amber-400/30 bg-amber-400/10 text-amber-200 px-3 py-2">${ICON('triangle-alert','w-4 h-4 mt-0.5 shrink-0')}${sentences('flags').map((s) => s.simple).join(' ')}</div>
  </div>
  ${['evidence','reasoning','macula','limits'].map((sec) => `
    <div class="px-5 py-4 border-b border-white/10">
      <div class="text-[11px] uppercase tracking-wider text-slate-500 mb-2 flex items-center gap-1.5">${ICON(SECTION_ICON[sec],'w-3.5 h-3.5')}${SECTION_TITLE[sec][0]}</div>
      <ul class="space-y-1">${sentences(sec).map((s) => `<li class="text-[14px] leading-snug px-2 py-1 rounded ${s.id === SELECTED ? 'bg-cyan-400/10 ring-1 ring-cyan-400/60 text-white' : 'text-slate-300'}">${s.simple}</li>`).join('')}</ul>
    </div>`).join('')}
  <p class="px-5 py-4 text-xs text-slate-500">Screening aid, not a diagnosis.</p>
</aside>`
lucide.createIcons()
</script>
</body>
</html>
