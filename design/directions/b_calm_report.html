<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction B — Calm Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="data/case.js"></script><script src="common.js"></script>
<style>body{font-family:"Source Sans 3",system-ui,sans-serif;font-feature-settings:"tnum" 1}</style>
</head>
<body class="bg-stone-100 text-stone-900">
<header class="bg-[#16324F] text-white">
  <div class="max-w-[1240px] mx-auto px-8 h-14 flex items-center justify-between">
    <div class="flex items-center gap-3 font-semibold tracking-tight"><span class="text-lg">RetinaScreen</span><span class="text-white/50 font-normal">Screening summary</span></div>
    <div class="flex items-center gap-4 text-sm"><span class="text-white/80">Wording</span>
      <div class="inline-flex rounded-full bg-white/10 p-0.5"><span class="px-3 py-1 rounded-full bg-white text-[#16324F] font-semibold">Simple</span><span class="px-3 py-1 text-white/80">Clinical</span></div></div>
  </div>
</header>
<main class="max-w-[1240px] mx-auto px-8 py-8" id="app"></main>
<script>
const g = C.grading.grade
document.getElementById('app').innerHTML = `
<section class="rounded-2xl overflow-hidden border border-stone-300 bg-white">
  <div class="px-8 py-6 flex items-start justify-between gap-8" style="border-left:10px solid ${STAGE_COLOR[g]}">
    <div>
      <div class="text-sm text-stone-500">Case ${C.source.image_id} · one eye · AI screening result</div>
      <h1 class="text-4xl font-bold mt-1" style="color:${STAGE_COLOR[g]}">Stage ${g} of 4: ${stagePlain(g)}</h1>
      <p class="text-stone-500 mt-1">${stageClinical(g)}</p>
    </div>
    <div class="text-right shrink-0">
      <div class="inline-flex items-center gap-2 rounded-full bg-amber-100 text-amber-900 px-4 py-2 font-semibold">${ICON('user-round-check','w-5 h-5')}Needs a doctor's look</div>
      <p class="text-sm text-stone-500 mt-2 max-w-[260px]">${sentences('flags').map((s) => s.simple).join(' ')}</p>
    </div>
  </div>
</section>
<section class="grid grid-cols-[minmax(0,1.25fr)_minmax(0,1fr)] gap-8 mt-8">
  <figure>
    <div class="rounded-2xl overflow-hidden bg-stone-900">${imageStack('')}</div>
    <figcaption class="mt-3 grid grid-cols-2 gap-x-6 gap-y-2 text-[15px]">
      ${LESIONS.map((k) => `<div class="flex items-center gap-2"><span class="w-3.5 h-3.5 rounded" style="background:${LESION_COLOR[k]}"></span><span class="font-semibold">${G[k].plain}</span><span class="text-stone-500 text-sm">${F.lesions[k].count}</span></div>`).join('')}
      <div class="flex items-center gap-2 text-stone-600"><span class="w-5 border-t-2 border-dashed border-sky-500"></span>${G.macula.plain}</div>
      <div class="flex items-center gap-2 text-stone-600"><span class="w-3.5 h-3.5 rounded-full border-2 border-stone-500"></span>${G.optic_disc.plain}</div>
    </figcaption>
  </figure>
  <article class="space-y-6">
    ${['evidence','reasoning','macula','limits'].map((sec, i) => `
      <div>
        <h2 class="flex items-center gap-2 text-lg font-bold text-[#16324F]"><span class="w-7 h-7 rounded-full bg-[#16324F] text-white grid place-items-center text-sm">${i + 1}</span>${SECTION_TITLE[sec][0]}</h2>
        <ul class="mt-2 space-y-1.5 pl-9 text-[17px] leading-relaxed">${sentences(sec).map((s) => `<li class="${s.id === SELECTED ? 'bg-sky-50 -mx-2 px-2 rounded border-l-4 border-sky-600' : ''}">${s.simple}</li>`).join('')}</ul>
      </div>`).join('')}
    <p class="text-sm text-stone-500 border-t border-stone-300 pt-4">Screening aid, not a diagnosis. Every number comes from this photo. A qualified clinician makes the final decision.</p>
  </article>
</section>`
lucide.createIcons()
</script>
</body>
</html>
