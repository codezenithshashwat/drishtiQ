# GPU queue (tools/gpu_queue.py). Jobs run top to bottom; the first enabled job that is not done/failed runs next.
# Quote every step. "python" = project venv. Rules applied here are pre-registered (ADR-013/015/016/017/018).
jobs:
  - id: a2_swap
    title: "A2: ADR-013 rule on fixed candidate reg384 s17 (venv runs 081750 / 082105) vs comparator; switch app grader if it passes"
    est_gpu_min: 1
    steps:
      - 'python tools/rules.py grader-swap --name a2_swap --adr ADR-013 --candidate finetune:models/checkpoints/phase2/graders/convnext_tiny_mixed_reg_plain384_datasetbal_sqrtcw_v1_s17.pt --baseline idrid_grading_val=20261028-234705-grade-frozen_models_checkpoints_phase1_frozen_ --baseline aptos_val=20261028-234822-grade-frozen_models_checkpoints_phase1_frozen_ --candidate-run idrid_grading_val=20261029-081750-grade-finetune_models_checkpoints_phase2_grade --candidate-run aptos_val=20261029-082105-grade-finetune_models_checkpoints_phase2_grade --apply'

  - id: a3_baseline_ddr
    title: "A3 prerequisite: v0.1 (v0 + pp_v2) evaluated on DDR-test (225) for the ADR-016 comparison"
    est_gpu_min: 10
    steps:
      - 'python -m eval segment --model v0 --split ddr_seg_test --postprocess configs/postprocess/pp_v2.json'

  - id: b5b6_metrics
    title: "B5 calibration/abstention (ADR-019) + B6 triage metric (ADR-020) for the current app grader"
    est_gpu_min: 15
    steps:
      - 'python tools/assistant_metrics.py'

  - id: a2_seed23
    title: "A2 seeds: reg384 seed 23 (same recipe)"
    est_gpu_min: 80
    steps:
      - 'python src/train/finetune_mixed.py --head reg --size 384 --seed 23'

  - id: a3_train
    title: "A3: U-Net/R18 on DDR train+valid + IDRiD dev (5-fold CV, fold 4 = candidate); pp re-selection on CV; IDRiD-val + DDR-test; ADR-016 per lesion"
    enabled: false  # 2026-10-30 ADR-041: cancelled by owner decision (not failed)
    est_gpu_min: 400  # measured 1.09 s/step x 4000 steps x 5 folds + evaluation
    large_output: true
    steps:
      - 'python src/train/seg_a3.py --fold 0'
      - 'python src/train/seg_a3.py --fold 1'
      - 'python src/train/seg_a3.py --fold 2'
      - 'python src/train/seg_a3.py --fold 3'
      - 'python src/train/seg_a3.py --fold 4'
      - 'python -m eval.seg_pp_select --cache results/cache/seg_a3_cv --fold4-model a3:models/checkpoints/phase2/seg_a3/unet_r18_fov1536_fold4_s17.pt --label a3-cv --fp-constraint --out configs/postprocess/pp_a3_v1.json'
      - 'python -m eval segment --model a3:models/checkpoints/phase2/seg_a3/unet_r18_fov1536_fold4_s17.pt --split idrid_seg_val --postprocess configs/postprocess/pp_a3_v1.json'
      - 'python -m eval segment --model a3:models/checkpoints/phase2/seg_a3/unet_r18_fov1536_fold4_s17.pt --split ddr_seg_test --postprocess configs/postprocess/pp_a3_v1.json'
      - 'python tools/rules.py seg-swap --name a3_swap --new-cv a3-cv+pp_a3_v1 --new a3:models/checkpoints/phase2/seg_a3/unet_r18_fov1536_fold4_s17.pt+pp_a3_v1 --new-spec a3:models/checkpoints/phase2/seg_a3/unet_r18_fov1536_fold4_s17.pt --new-pp configs/postprocess/pp_a3_v1.json --apply'
      - 'python tools/agreement_app.py'
      - 'python tools/freeze_check.py'
      - 'python tools/key_numbers.py'
      - 'python tools/scorecard.py'
      - 'python -m pytest -q backend tests'

  - id: dme_refit
    title: "DME rule refit on dev-train with the app segmenter (after A3); report IDRiD-val; app uses the refit"
    enabled: false  # 2026-10-30 ADR-041: cancelled by owner decision (not failed)
    est_gpu_min: 25
    steps:
